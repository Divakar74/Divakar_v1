<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — node not found</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <style>
      .not-found {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .not-found-title {
        font-family: var(--font-display);
        font-size: clamp(3rem, 8vw, 6rem);
        line-height: 0.95;
      }
      .not-found-link {
        font-family: var(--font-mono);
        font-size: var(--text-mono);
        color: var(--accent);
        border-bottom: 1px solid var(--accent);
        padding-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <main class="container not-found">
      <span class="mono">404 // disconnected node</span>
      <h1 class="not-found-title">no nearest <span class="serif-italic">neighbour</span> here.</h1>
      <p class="mono">the requested path does not exist in this graph.</p>
      <a class="not-found-link" href="./">← return to the graph</a>
    </main>
  </body>
</html>
